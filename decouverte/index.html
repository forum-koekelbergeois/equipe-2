<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KylYou</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div>
    <h1>KylYou</h1>
    <button id="bouton">Clique ici</button>
    <button id="musique">Musique 67</button>
    <button id="personnage">Personnage 67</button>
    <button id="couleur">Change le fond</button>
    <div id="chien" hidden>
      <div class="tete">🐶</div>
      <div class="corps">
        <span class="patte gauche">🐾</span>
        <span class="chiffres">67</span>
        <span class="patte droite">🐾</span>
      </div>
    </div>
    <div id="perso" hidden>
      <div class="perso-tete">😎</div>
      <div class="perso-corps"></div>
      <div class="bras bras-gauche"></div>
      <div class="bras bras-droit"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
